        /* 购物车相关样式 */
        .cart-icon-container {
            position: relative;
            margin-left: 20px;
        }
        
        .cart-icon {
            color: #2d5016;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .cart-icon:hover {
            color: #27ae60;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            font-size: 0.8rem;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            display: none;
        }
        
        /* 购物车按钮样式 */
        .add-to-cart-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            margin-top: 1rem;
            width: 100%;
            font-weight: 500;
        }
        
        .add-to-cart-btn:hover {
            background: #219653;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(39, 174, 96, 0.3);
        }
        
        .add-to-cart-btn.added {
            background: #3498db;
        }
        
        .add-to-cart-btn.added:hover {
            background: #2980b9;
        }
        
        .add-to-cart-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 价格显示样式 */
        .flower-price {
            color: #e74c3c;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .flower-stock {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .stock-available {
            color: #27ae60;
        }
        
        .stock-low {
            color: #f39c12;
        }
        
        .stock-out {
            color: #e74c3c;
        }
        
        /* 购物车弹窗 */

            right: 20px;

            border-radius: 8px;

            transform: translateX(120%);

        .cart-notification.show {
            transform: translateX(0);
        }
        
        .cart-notification-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .cart-notification-image {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .cart-notification-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cart-notification-info {
            flex: 1;
        }
        
        .cart-notification-info h5 {
            margin: 0 0 5px 0;
            color: #2d5016;
        }
        
        .cart-notification-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            gap: 10px;

        .btn-view-cart {

            background: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;

        .btn-checkout {

            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;

            background: #2d5016;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

            margin-top: 30px;

        // 图片错误处理函数（使用和首页相同的方法）
        function handleFlowerImageError(img) {
            const altText = img.alt || '花卉图片';
            const placeholderColors = {
                '玫瑰': 'ff6b6b', '郁金香': '74b9ff', '百合': 'a29bfe', 
                '兰花': '55efc4', '牡丹': 'fd79a8', '向日葵': 'fdcb6e',
                '康乃馨': 'e17055', '茉莉': '00cec9'
            };
            const color = placeholderColors[altText] || '2d5016';
            img.src = `https://via.placeholder.com/300x200/${color}/ffffff?text=${encodeURIComponent(altText)}`;
        }
        
        function handleNotificationImageError(img) {
            const flowerName = img.alt || '花卉';
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">
                    <rect width="100%" height="100%" fill="#2d5016"/>
                    <text x="50%" y="50%" text-anchor="middle" dy=".3em" 
                          fill="white" font-family="Arial" font-size="12">
                        ${flowerName}
                    </text>
                </svg>
            `;
            img.src = 'data:image/svg+xml;base64,' + btoa(svg);
        }
        
        function closeCartNotification() {
            const notification = document.getElementById('cartNotification');
            notification.classList.remove('show');
        }
        
        function showCartNotification(productName, productImage, cartCount) {
            const notificationTitle = document.getElementById('notificationTitle');
            const notificationImage = document.getElementById('notificationImage');
            const cartItemCount = document.getElementById('cartItemCount');
            
            if (notificationTitle) notificationTitle.textContent = `${productName} 已加入购物车`;
            if (cartItemCount) cartItemCount.textContent = cartCount;
            
            if (notificationImage && productImage) {
                notificationImage.src = productImage;
                notificationImage.alt = productName;
            }
            
            const notification = document.getElementById('cartNotification');
            if (notification) {
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 5000);
            }
        }
        
        // 搜索回车键处理
        function handleSearchKeypress(event) {
            if (event.key === 'Enter') {
                applySearch();
            }
        }
        
        // 更新购物车数量显示
        function updateCartCountDisplay() {
            const cartCountElement = document.getElementById('cartCount');
            if (cartCountElement) {
                try {
                    const savedCart = localStorage.getItem('flowerCart');
                    if (savedCart) {
                        const cartItems = JSON.parse(savedCart);
                        const count = cartItems.reduce((total, item) => total + item.quantity, 0);
                        cartCountElement.textContent = count;
                        cartCountElement.style.display = count > 0 ? 'flex' : 'none';
                        return count;
                    } else {
                        cartCountElement.style.display = 'none';
                        return 0;
                    }
                } catch (e) {
                    cartCountElement.style.display = 'none';
                    return 0;
                }
            }
            return 0;
        }
        
        // 添加到购物车函数（使用和首页相同的方法）
        function addToCart(id, name, scientificName, language, price, image, color, season, stock) {
            if (stock <= 0) {
                alert(`${name} 已售罄，请选择其他花卉`);
                return;
            }
            
            let cart = JSON.parse(localStorage.getItem('flowerCart') || '[]');
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                if (existingItem.quantity >= stock) {
                    alert(`最多只能购买 ${stock} 件 ${name}`);
                    return;
                }
                existingItem.quantity++;
            } else {
                cart.push({
                    id: id,
                    name: name,
                    scientificName: scientificName,
                    language: language,
                    price: price,
                    image: image,
                    color: color,
                    season: season,
                    quantity: 1,
                    stock: stock
                });
            }
            
            localStorage.setItem('flowerCart', JSON.stringify(cart));
            const cartCount = updateCartCountDisplay();
            window.dispatchEvent(new Event('storage'));
            showCartNotification(name, image, cartCount);
            
            const button = event.target;
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-check"></i> 已添加';
            button.classList.add('added');
            
            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('added');
            }, 2000);
        }
        
        // 渲染花卉卡片
        function renderFlowers(flowers) {
            const flowerGrid = document.getElementById('flowerGrid');
            const noResults = document.getElementById('noResults');
            
            if (!flowers || flowers.length === 0) {
                flowerGrid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            let html = '';
            flowers.forEach(flower => {
                const stockClass = flower.stock > 10 ? 'stock-available' : 
                                 flower.stock > 0 ? 'stock-low' : 'stock-out';
                const stockText = flower.stock > 10 ? '库存充足' : 
                                flower.stock > 0 ? `仅剩 ${flower.stock} 件` : '暂时缺货';
                
                html += `
                <div class="flower-card">
                    <a href="${flower.link}" class="flower-image-link">
                        <img src="${flower.image}" alt="${flower.name}" onerror="handleFlowerImageError(this)">
                    </a>
                    <div class="flower-info">
                        <h4>${flower.name}</h4>
                        <p class="scientific-name">${flower.scientificName}</p>
                        <p class="flower-language">${flower.language}</p>
                        
                        <div class="flower-price">¥${flower.price.toFixed(2)}</div>
                        <div class="flower-stock ${stockClass}">${stockText}</div>
                        
                        <div class="tags">
                            <span class="tag color">${flower.colorText}</span>
                            <span class="tag season">${flower.monthText}</span>
                            <span class="tag type">${flower.typeText}</span>
                        </div>
                        
                        <div class="flower-actions">
                            <button class="add-to-cart-btn" 
                                    onclick="addToCart(${flower.id}, '${flower.name}', '${flower.scientificName}', '${flower.language}', ${flower.price}, '${flower.image}', '${flower.colorText}', '${flower.monthText}', ${flower.stock})"
                                    ${flower.stock <= 0 ? 'disabled' : ''}>
                                <i class="fas ${flower.stock > 0 ? 'fa-cart-plus' : 'fa-ban'}"></i>
                                ${flower.stock > 0 ? '加入购物车' : '暂时缺货'}
                            </button>
                            <a href="${flower.link}" class="btn btn-primary">
                                <i class="fas fa-eye"></i> 详情
                            </a>
                        </div>
                    </div>
                </div>
                `;
            });
            
            flowerGrid.innerHTML = html;
        }
        
        // 应用筛选
        function applyFilters() {
            const month = document.getElementById('month-filter').value;
            const type = document.getElementById('type-filter').value;
            const color = document.getElementById('color-filter').value;
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            
            console.log('筛选条件:', { month, type, color, searchKeyword });
            
            let filtered = flowersData;
            
            // 按月份筛选
            if (month !== 'all') {
                filtered = filtered.filter(flower => flower.month === month);
            }
            
            // 按类型筛选
            if (type !== 'all') {
                filtered = filtered.filter(flower => flower.type === type);
            }
            
            // 按颜色筛选
            if (color !== 'all') {
                filtered = filtered.filter(flower => flower.colors.includes(color));
            }
            
            // 按关键词搜索
            if (searchKeyword.trim() !== '') {
                filtered = filtered.filter(flower => 
                    flower.name.toLowerCase().includes(searchKeyword) ||
                    flower.scientificName.toLowerCase().includes(searchKeyword) ||
                    flower.language.toLowerCase().includes(searchKeyword)
                );
            }
            
            console.log('筛选结果:', filtered.length, '个花卉');
            console.log('花卉名称:', filtered.map(f => f.name));
            
            // 更新筛选结果信息
            const filterResults = document.getElementById('filterResults');
            const filterResultText = document.getElementById('filterResultText');
            const filterResultCount = document.getElementById('filterResultCount');
            
            if (filtered.length === flowersData.length && month === 'all' && type === 'all' && color === 'all' && searchKeyword === '') {
                filterResults.style.display = 'none';
            } else {
                filterResults.style.display = 'flex';
                
                const monthText = getMonthText(month);
                const typeText = getTypeText(type);
                const colorText = getColorText(color);
                
                filterResultText.textContent = `筛选结果：${monthText} | ${typeText} | ${colorText}`;
                filterResultCount.textContent = `共找到 ${filtered.length} 种花卉`;
            }
            
            // 渲染筛选结果
            renderFlowers(filtered);
        }
        
        // 应用搜索
        function applySearch() {
            applyFilters(); // 搜索和筛选使用相同的逻辑
        }
        
        // 重置筛选
        function resetFilters() {
            document.getElementById('month-filter').value = 'all';
            document.getElementById('type-filter').value = 'all';
            document.getElementById('color-filter').value = 'all';
            document.getElementById('searchInput').value = '';
            document.getElementById('filterResults').style.display = 'none';
            renderFlowers(flowersData);
        }
        
        // 重置所有
        function resetAll() {
            resetFilters();
        }
        
        // 获取月份文本
        function getMonthText(value) {
            const monthMap = {
                'all': '全部月份',
                '1-3': '1-3月',
                '3-5': '3-5月',
                '4-5': '4-5月',
                '5-8': '5-8月',
                '5-9': '5-9月',
                '5-10': '5-10月',
                '6-8': '6-8月',
                '7-9': '7-9月'
            };
            return monthMap[value] || '全部月份';
        }
        
        // 获取类型文本
        function getTypeText(value) {
            const typeMap = {
                'all': '全部类型',
                'herb': '草本类',
                'shrub': '灌木类',
                'bulb': '球根类',
                'vine': '藤本类'
            };
            return typeMap[value] || '全部类型';
        }
        
        // 获取颜色文本
        function getColorText(value) {
            const colorMap = {
                'all': '全部颜色',
                'red': '红色系',
                'pink': '粉色系',
                'white': '白色系',
                'yellow': '黄色系',
                'purple': '紫色系'
            };
            return colorMap[value] || '全部颜色';
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 初始渲染所有花卉
            renderFlowers(flowersData);
            
            // 更新购物车数量显示
            updateCartCountDisplay();
            
            // 监听购物车变化
            window.addEventListener('storage', function(e) {
                if (e.key === 'flowerCart') {
                    updateCartCountDisplay();
                }
            });
            
            // 处理缺失的图片
            setTimeout(() => {
                const images = document.querySelectorAll('img');
                images.forEach(img => {
                    if (!img.complete || img.naturalHeight === 0) {
                        if (img.id !== 'notificationImage') {
                            handleFlowerImageError(img);
                        }
                    }
                });
            }, 100);
            
            console.log('页面初始化完成，共有', flowersData.length, '个花卉');
        });
    </script>
</body>
</html>
