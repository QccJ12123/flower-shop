<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 花卉百科</title>
  <style>
    /* 原有的CSS样式保持不变 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8fdf8 0%, #f0f9f0 50%, #e8f5e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(45, 80, 22, 0.15);
      overflow: hidden;
      width: 100%;
      max-width: 420px;
      border: 1px solid #e8f5e8;
    }

    .login-header {
      background: linear-gradient(135deg, #2d5016 0%, #4a7c59 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-header::before {
      content: '🌺🌸🌼🌷💐';
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      font-size: 1.5rem;
      opacity: 0.3;
    }

    .login-header h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 300;
      position: relative;
    }

    .login-header p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .login-form {
      padding: 40px 30px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #2d5016;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8f5e8;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #f8fdf8;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2d5016;
      background: white;
      box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
      transform: translateY(-2px);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2d5016 0%, #4a7c59 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(45, 80, 22, 0.3);
      background: linear-gradient(135deg, #4a7c59 0%, #5d9c47 100%);
    }

    .login-links {
      text-align: center;
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .login-links a {
      color: #4a7c59;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .login-links a:hover {
      color: #2d5016;
      background: rgba(45, 80, 22, 0.1);
      text-decoration: none;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
      display: none;
      border: 1px solid #fcc;
    }

    .success-message {
      background: #f0f9f0;
      color: #2d5016;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
      display: none;
      border: 1px solid #c8e6c9;
    }

    .back-to-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-to-home a {
      color: #7a9c6b;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .back-to-home a:hover {
      color: #2d5016;
    }

    @media (max-width: 480px) {
      .login-container {
        margin: 10px;
      }
      
      .login-header {
        padding: 30px 20px;
      }
      
      .login-form {
        padding: 30px 20px;
      }
      
      .login-header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🌺 花卉百科</h1>
      <p>欢迎回到花卉世界</p>
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
    
    <form class="login-form" id="loginForm" action="login" method="post">
      <div class="form-group">
        <label for="username">用户名 / 邮箱</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" required>
      </div>
      
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required>
      </div>
      
      <button type="submit" class="login-btn">登录</button>
      
      <div class="login-links">
        <a href="forget.html">忘记密码?</a>
        <a href="register.html">注册新账号</a>
      </div>
    </form>

    <div class="back-to-home">
      <a href="index.html">← 返回网站首页</a>
    </div>
  </div>

  <script>
    // 智能登录处理
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // 阻止默认提交
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      
      // 隐藏所有消息
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      // 基础验证
      if (!username || !password) {
        errorMessage.textContent = '请输入用户名和密码';
        errorMessage.style.display = 'block';
        return;
      }
      
      // 检查当前环境
      const isServerEnvironment = window.location.protocol === 'http:' || window.location.protocol === 'https:';
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      
      if (isServerEnvironment && isLocalhost) {
        // 服务器环境：正常提交到后端
        console.log('服务器环境，提交到后端');
        this.action = '/login';
        this.method = 'post';
        this.submit();
      } else {
        // 文件环境或非本地服务器：模拟登录
        console.log('文件环境，模拟登录');
        simulateLogin(username, password);
      }
    });
    
    // 修改后的模拟登录函数
    function simulateLogin(username, password) {
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      
      // 检查本地存储的用户
      const localUsers = JSON.parse(localStorage.getItem('flowerUsers') || '[]');
      const localUser = localUsers.find(user => 
        user.username === username && user.password === password
      );
      
      // 模拟测试账号
      const testAccounts = [
        { username: 'admin', password: 'Admin123' },
        { username: 'test', password: 'Test123' },
        { username: 'user', password: 'User123' }
      ];
      
      const isValid = testAccounts.some(account => 
        account.username === username && account.password === password
      ) || !!localUser;
      
      if (isValid || (username && password.length >= 6)) {
        // 登录成功
        const userName = localUser ? localUser.name : username;
        successMessage.textContent = `登录成功！欢迎 ${userName} 回到花卉百科！正在跳转到首页...`;
        successMessage.style.display = 'block';
        
        // 保存登录状态到本地存储
        localStorage.setItem('currentUser', JSON.stringify({
          username: username,
          name: userName,
          loginTime: new Date().toISOString()
        }));
        
        // 2秒后跳转到首页
        setTimeout(() => {
          if (window.location.pathname.includes('/Public/')) {
            window.location.href = 'index.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 2000);
      } else {
        // 登录失败
        errorMessage.textContent = '用户名或密码错误。测试账号：admin/Admin123 或使用已注册的账号';
        errorMessage.style.display = 'block';
      }
    }
  </script>
</body>
</html>
